name: Build NUMO OGS LaTeX slides
on:
  push:
    paths:
      - 'training/ogs-excavation-60min/presentation/OGS_Excavation_Introduction.tex'
      - 'training/ogs-excavation-60min/presentation/generate_assets.py'
      - 'training/ogs-excavation-60min/presentation/README.md'
      - '.github/workflows/build-numo-ogs-beamer.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install slide build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended python3-numpy python3-matplotlib python3-scipy python3-meshio python3-pil
      - name: Generate figures and compile Beamer
        working-directory: training/ogs-excavation-60min/presentation
        run: |
          python3 generate_assets.py
          pdflatex -interaction=nonstopmode -halt-on-error OGS_Excavation_Introduction.tex
          pdflatex -interaction=nonstopmode -halt-on-error OGS_Excavation_Introduction.tex
          test -s OGS_Excavation_Introduction.pdf
          pdfinfo OGS_Excavation_Introduction.pdf | grep Pages
      - name: Commit only the finished PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training/ogs-excavation-60min/presentation/OGS_Excavation_Introduction.pdf
          git diff --cached --quiet || { git commit -m "Add compiled NUMO workshop Beamer presentation PDF"; git push origin HEAD:main; }
